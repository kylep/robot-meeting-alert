name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        project: [project-1, project-2, project-3]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ninja
      - name: Tests
        run: make test
      - name: Build app
        run: make mac

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [project-1, project-2, project-3]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Build firmware
        run: make firmware PICO_TOOLCHAIN_PATH=
      - name: Size
        run: make size PICO_TOOLCHAIN_PATH=
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-firmware
          path: ${{ matrix.project }}/build/firmware/*.uf2
